services:
  - type: web
    name: communitylab-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: communitylab-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: oci
      - key: STORAGE_BUCKET
        sync: false
      - key: OCI_NAMESPACE
        sync: false
      - key: OCI_REGION
        sync: false
      - key: OCI_USE_INSTANCE_PRINCIPAL
        value: "false"
      - key: OCI_CONFIG_FILE
        value: /etc/secrets/oci_config
      - key: API_WRITE_KEY
        sync: false
      - key: MUTATIONS_ENABLED
        value: "true"

  - type: web
    name: communitylab-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./dashboard/Dockerfile
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: communitylab-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_WRITE_KEY
        sync: false

databases:
  - name: communitylab-db
    plan: free
    databaseName: communitylab
    user: communitylab
