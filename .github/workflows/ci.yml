name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint and static analysis
        run: ruff check app dashboard tests
      - name: Check formatting of changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only --diff-filter=ACM "$BASE_SHA" "$GITHUB_SHA" -- '*.py')
          if [ -n "$files" ]; then ruff format --check $files; fi
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Validate dashboard modules
        run: python -m py_compile dashboard/app.py dashboard/api_client.py

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
      - run: terraform -chdir=infra/oci fmt -check -recursive
      - run: terraform -chdir=infra/oci init -backend=false
      - run: terraform -chdir=infra/oci validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://communitylab:communitylab@localhost:5432/communitylab_test
      TEST_DATABASE_URL: postgresql+psycopg://communitylab:communitylab@localhost:5432/communitylab_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: communitylab_test
          POSTGRES_USER: communitylab
          POSTGRES_PASSWORD: communitylab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U communitylab -d communitylab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Alembic migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
      - run: python -m pytest -q tests

  deployed-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public API health
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors --max-time 15 https://communitylab-api.onrender.com/api/v1/health
      - name: Check public dashboard
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors --max-time 15 --output /dev/null https://communitylab-dashboard.onrender.com/
